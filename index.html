<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Source Control</title>
<style>
  /* Tokens tomados del tema de Orca, para que la pestaña se sienta parte de la app. */
  :root {
    color-scheme: dark;
    --bg:#1e1e1e; --side:#212121; --raised:#2a2a2a; --hover:#ffffff0d; --active:#ffffff14;
    --line:#ffffff12; --input:#ffffff26; --fg:#fafafa; --soft:#d4d4d4; --muted:#a1a1a1; --faint:#737373;
    --primary:#e5e5e5; --on-primary:#171717;
    --add:#4ade80; --del:#f87171; --warn:#fbbf24; --info:#93c5fd;
    --add-bg:#4ade8014; --del-bg:#f8717114; --add-w:#4ade8040; --del-w:#f8717140;
    --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"SF Mono",SFMono-Regular,ui-monospace,"Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg:#fff; --side:#fafafa; --raised:#fff; --hover:#0000000a; --active:#00000012;
      --line:#e5e5e5; --input:#e5e5e5; --fg:#0a0a0a; --soft:#262626; --muted:#737373; --faint:#a3a3a3;
      --primary:#171717; --on-primary:#fafafa;
      --add:#16a34a; --del:#dc2626; --warn:#b45309; --info:#2563eb;
      --add-bg:#16a34a14; --del-bg:#dc262614; --add-w:#16a34a33; --del-w:#dc262633;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; background:var(--bg); color:var(--soft); font:13px/1.45 var(--sans); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; }
  svg { display:block; flex:none; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--active); border-radius:4px; }
  ::-webkit-scrollbar-track { background:none; }

  #side { width:340px; flex:none; display:flex; flex-direction:column; min-height:0; background:var(--side); border-right:1px solid var(--line); }
  #top { padding:10px 10px 8px; }
  #find { height:30px; padding:0 10px; }
  #summary { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; min-height:22px; align-items:center; font-size:12px; color:var(--faint); }
  #summary span { padding:0 2px; }
  .chip { height:22px; padding:0 8px; border:0; border-radius:5px; background:var(--hover); color:var(--muted); font-size:12px; cursor:pointer; }
  .chip:hover { color:var(--fg); }
  .chip.on { background:var(--active); color:var(--fg); }
  #list { flex:1; min-height:0; overflow-y:auto; padding:0 6px 10px; }
  #empty { padding:24px 10px; color:var(--faint); text-align:center; }

  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #bar { height:38px; flex:none; display:flex; align-items:center; gap:6px; padding:0 12px; border-bottom:1px solid var(--line); }
  #back { display:none; }
  #title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:var(--muted); }
  #diff { flex:1; min-height:0; margin:0; padding:6px 0; overflow:auto; font:12px/1.6 var(--mono); }
  #diff div { padding:0 14px; white-space:pre; min-width:max-content; }
  #blank { flex:1; display:flex; align-items:center; justify-content:center; color:var(--faint); }
  .add { color:var(--add); background:var(--add-bg); }
  .del { color:var(--del); background:var(--del-bg); }
  .add .w { background:var(--add-w); border-radius:2px; }
  .del .w { background:var(--del-w); border-radius:2px; }
  #diff div.sb { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); padding:0; min-width:0; white-space:normal; }
  .sb > span { min-width:0; padding:0 12px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .sb > span + span { border-left:1px solid var(--line); }
  .hunk { color:var(--info); }
  .meta-line { color:var(--faint); }

  .space { display:flex; align-items:center; gap:7px; height:32px; margin-top:12px; padding:0 8px; border-radius:6px; color:var(--muted); cursor:pointer; user-select:none; }
  #list > .space:first-child { margin-top:0; }
  .space:hover { background:var(--hover); }
  .space b { font-size:13px; font-weight:600; color:var(--fg); }
  .kids { margin:2px 0 0 13px; padding-left:5px; border-left:1px solid var(--line); }
  .repo { display:flex; align-items:center; gap:6px; height:28px; padding:0 6px; border-radius:6px; cursor:pointer; user-select:none; }
  .repo:hover, .repo.open { background:var(--hover); }
  .repo.wt { margin-left:18px; }
  .repo.wt .name { color:var(--muted); }
  .more { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  .dot { width:6px; height:6px; flex:none; border-radius:50%; background:var(--warn); }
  .dot.up { background:var(--info); }
  .dlg input { height:32px; padding:0 10px; }
  .name { flex:none; max-width:55%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:400; color:var(--soft); }
  .repo:hover .name, .repo.open .name { color:var(--fg); }
  .folder { color:var(--faint); }
  .branch { display:flex; align-items:center; gap:4px; min-width:0; overflow:hidden; padding:1px 5px; border:0; border-radius:5px; background:none; color:var(--muted); font-size:12px; cursor:pointer; }
  .branch:hover { background:var(--active); color:var(--fg); }
  .branch span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .branch .tail { flex:none; margin-left:-4px; }
  .branch.locked { color:var(--faint); }
  .grow { flex:1; min-width:0; }
  .count { flex:none; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .count.dirty { color:var(--warn); }
  .count.merged { color:var(--add); }
  .tools { display:none; flex:none; gap:1px; }
  .repo:hover .tools, .repo:focus-within .tools { display:flex; }
  .repo:hover .count { display:none; }
  .icon { width:24px; height:24px; flex:none; display:flex; align-items:center; justify-content:center; padding:0; border:0; border-radius:5px; background:none; color:var(--muted); cursor:pointer; }
  .icon:hover { background:var(--active); color:var(--fg); }
  .chev { color:var(--faint); transition:transform .12s; }
  .icon:disabled, .chip:disabled, .branch:disabled { opacity:.45; background:none; color:var(--muted); cursor:not-allowed; }
  textarea:disabled { opacity:.6; cursor:not-allowed; }
  .repo.busy .tools, .repo.busy .count { display:none; }
  .doing { display:flex; flex:none; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
  .spin { width:11px; height:11px; flex:none; border:1.5px solid var(--input); border-top-color:var(--fg); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .chev.down { transform:rotate(90deg); }

  .body { padding:8px 6px 10px 18px; }
  .seg { display:flex; gap:2px; padding:2px; margin-bottom:8px; border-radius:7px; background:var(--hover); }
  .seg button { flex:1; height:24px; border:0; border-radius:5px; background:none; color:var(--muted); font-size:12px; cursor:pointer; }
  .seg button.on { background:var(--active); color:var(--fg); }
  textarea, input { width:100%; display:block; background:var(--hover); color:var(--fg); border:1px solid var(--line); border-radius:7px; outline:0; font:inherit; }
  textarea { padding:7px 9px; resize:vertical; }
  textarea:focus, input:focus { border-color:var(--input); }
  ::placeholder { color:var(--faint); }
  .commit { width:100%; height:28px; margin:6px 0 2px; border:0; border-radius:7px; background:var(--primary); color:var(--on-primary); font-size:12px; font-weight:500; cursor:pointer; }
  .commit-row { display:flex; gap:6px; }
  a.commit { display:flex; align-items:center; justify-content:center; text-decoration:none; }
  .commit:disabled { background:var(--hover); color:var(--faint); cursor:not-allowed; }
  .commit.ghost { background:none; border:1px solid var(--line); color:var(--soft); }
  .commit.ghost:hover:enabled { background:var(--hover); }
  .commit.ghost:disabled { background:none; color:var(--faint); }
  .note { margin:6px 0 2px; font-size:12px; color:var(--muted); }
  .note.warn, .path.warn { color:var(--warn); }
  .group { display:flex; align-items:center; height:24px; margin-top:8px; font-size:11px; font-weight:500; color:var(--faint); }
  .row { display:flex; align-items:center; gap:6px; height:24px; padding:0 2px 0 6px; border-radius:5px; cursor:pointer; }
  .row:hover { background:var(--hover); }
  .row.on { background:var(--active); }
  .row .icon { visibility:hidden; width:20px; height:20px; }
  .row:hover .icon { visibility:visible; }
  .path { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }
  .st { width:12px; flex:none; font:600 11px var(--mono); color:var(--warn); }
  .st.A, .st.U { color:var(--add); } .st.D { color:var(--del); }
  .log { padding:4px 6px; border-radius:5px; cursor:pointer; }
  .log:hover { background:var(--hover); }
  .log div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { font-size:11px; color:var(--faint); }

  #toast { position:fixed; right:14px; bottom:14px; max-width:420px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--raised); color:var(--fg); font-size:12px; white-space:pre-wrap; display:none; cursor:pointer; box-shadow:0 8px 24px #0006; }
  #toast.bad { border-color:var(--del); }
  #modal { position:fixed; inset:0; display:none; justify-content:center; align-items:flex-start; padding-top:12vh; background:#0006; }
  #box { width:480px; max-width:calc(100% - 24px); max-height:60vh; display:flex; flex-direction:column; overflow:hidden; background:var(--raised); border:1px solid var(--line); border-radius:10px; box-shadow:0 16px 48px #0008; }
  #box input { height:40px; padding:0 12px; border:0; border-bottom:1px solid var(--line); border-radius:0; background:none; }
  #box .list { overflow:auto; padding:4px; }
  .opt { display:flex; gap:10px; align-items:center; min-height:30px; padding:3px 8px; border-radius:6px; cursor:pointer; }
  .opt:hover { background:var(--hover); }
  .opt span:first-child { flex:1; min-width:0; overflow-wrap:anywhere; color:var(--fg); }

  .dlg { display:flex; flex-direction:column; min-height:0; padding:14px; gap:8px; }
  .dlg h2 { margin:0; font-size:13px; font-weight:600; color:var(--fg); }
  .dlg p { margin:0; font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
  .dlg p.warn { color:var(--warn); }
  .dlg ul { min-height:0; margin:0; padding:0; overflow:auto; list-style:none; font:12px/1.7 var(--mono); color:var(--soft); }
  .dlg li { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dlg li span { color:var(--faint); }
  .acts { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; margin-top:6px; }
  .acts button { height:28px; padding:0 12px; border:1px solid var(--line); border-radius:7px; background:none; font-size:12px; cursor:pointer; }
  .acts button:hover { background:var(--hover); }
  .acts button.primary { border-color:transparent; background:var(--primary); color:var(--on-primary); font-weight:500; }
  .acts button.danger { color:var(--del); }

  /* En una vista dividida no entran las dos columnas: el diff pasa a ocupar la lista. */
  @media (max-width:760px) {
    #side { width:100%; border-right:0; }
    #main { display:none; }
    body.detail #side { display:none; }
    body.detail #main { display:flex; }
    #back { display:flex; }
  }
</style>
</head>
<body>
<aside id="side">
  <div id="top"><input id="find" placeholder="Buscar repos" aria-label="Buscar repos" /><div id="summary"></div></div>
  <div id="list"></div>
</aside>
<main id="main">
  <div id="bar"><button id="back" class="icon" title="Volver"></button><span id="title"></span></div>
  <div id="blank">Elegí un archivo o un commit</div>
  <pre id="diff" hidden></pre>
</main>
<div id="toast"></div>
<div id="modal"><div id="box"></div></div>
<script>
(function () {
'use strict'
var TOKEN = new URLSearchParams(location.search).get('t')
var data = []
var snapshot = ''
var expanded = {}
var tab = {}
var drafts = {}
var logs = {}
var selected = ''
var closedSpaces = readClosed()
// Cada render rehace los botones: lo que está en curso se guarda acá y no en el botón.
var busy = {}
var diffRequest = 0
var OFFLINE_POLLS = 3
var SPLIT_WIDTH = 900
var MAX_WORD_DIFF = 2000
var MIN_SAME_RATIO = 0.3
var TAIL_CHARS = 12
var SHORT_BRANCH = 24
var filter = ''
var firstRank = null
var lastDiff = null
var splitShown = false
var offline = 0
var lostToast = false
var BUSY_TEXT = {
  stage: 'Pasando a Staged', unstage: 'Sacando de Staged', stage_all: 'Pasando a Staged', unstage_all: 'Sacando de Staged',
  discard: 'Descartando', commit: 'Commiteando', push: 'Subiendo', pull: 'Trayendo', fetch: 'Consultando el remoto',
  switch: 'Cambiando de rama', create_branch: 'Creando la rama'
}
var list = document.getElementById('list')
var find = document.getElementById('find')

var ICONS = {
  chevron: '<path d="m9 18 6-6-6-6"/>',
  branch: '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  lock: '<rect width="16" height="11" x="4" y="11" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  fetch: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  pull: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
  push: '<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  minus: '<path d="M5 12h14"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  undo: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>'
}
function svg(name, size) {
  var wrap = document.createElement('span')
  var s = size || 14
  wrap.innerHTML = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>'
  return wrap.firstChild
}
function readClosed() {
  try {
    return JSON.parse(localStorage.getItem('closedSpaces')) || {}
  } catch (e) {
    return {} // sin almacenamiento, todos los grupos arrancan abiertos
  }
}
function saveClosed() {
  try {
    localStorage.setItem('closedSpaces', JSON.stringify(closedSpaces))
  } catch (e) {
    // Es solo una comodidad de esta pestaña: si no se guarda, no se pierde nada.
  }
}
function el(tag, cls, text) {
  var n = document.createElement(tag)
  if (cls) n.className = cls
  if (text !== undefined) n.textContent = text
  return n
}
function reply(r) {
  return r.json().then(function (j) {
    if (!r.ok) throw Object.assign(new Error(j.error || 'Error'), { sensitive: j.sensitive })
    return j
  })
}
function api(path) {
  return fetch(path, { headers: { 'X-Token': TOKEN } }).then(reply)
}
function toast(text, ok) {
  var t = document.getElementById('toast')
  t.textContent = text
  t.className = ok ? '' : 'bad'
  t.style.display = 'block'
  if (ok) setTimeout(function () { t.style.display = 'none' }, 2500)
}
document.getElementById('toast').onclick = function () { this.style.display = 'none' }
// Una cosa por repo a la vez: un segundo clic haría el commit dos veces o abriría otra terminal.
function whileBusy(repo, text, work) {
  if (busy[repo]) return Promise.resolve()
  busy[repo] = text
  render()
  return work().finally(function () {
    delete busy[repo]
    render()
  })
}
function act(repo, action, extra, okText) {
  var body = Object.assign({ repo: repo, action: action }, extra || {})
  return whileBusy(repo, BUSY_TEXT[action], function () {
    return fetch('/api/action', {
      method: 'POST',
      headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(reply).then(function () {
      if (okText) toast(okText, true)
      delete logs[repo]
      return load(true)
    }).catch(function (e) {
      if (e.sensitive) sensitiveDialog(repo, action, extra, okText, e.sensitive)
      else toast(e.message)
    })
  })
}
// Marca solo lo que cambió dentro de la línea: alcanza con recortar lo común de cada punta.
function changedRange(text, other) {
  if (text.length > MAX_WORD_DIFF || other.length > MAX_WORD_DIFF) return null
  var max = Math.min(text.length, other.length)
  var start = 0
  while (start < max && text[start] === other[start]) start++
  var end = 0
  while (end < max - start && text[text.length - 1 - end] === other[other.length - 1 - end]) end++
  if (start + end === text.length || (start + end) / text.length < MIN_SAME_RATIO) return null
  return [start, text.length - end]
}
function lineNode(tag, cls, sign, text, other) {
  var n = el(tag, cls)
  var range = other === undefined ? null : changedRange(text, other)
  if (!range) {
    n.textContent = sign + text || ' '
    return n
  }
  n.appendChild(document.createTextNode(sign + text.slice(0, range[0])))
  n.appendChild(el('span', 'w', text.slice(range[0], range[1])))
  n.appendChild(document.createTextNode(text.slice(range[1])))
  return n
}
function diffItems(text) {
  var items = []
  var del = []
  var add = []
  var inHunk = false
  function flush() {
    if (del.length || add.length) items.push({ del: del, add: add })
    del = []
    add = []
  }
  text.split('\n').forEach(function (line) {
    if (/^diff /.test(line)) inHunk = false
    if (inHunk && line[0] === '-') return del.push(line.slice(1))
    if (inHunk && line[0] === '+') return add.push(line.slice(1))
    flush()
    if (/^@@/.test(line)) inHunk = true
    var kind = /^@@/.test(line) ? 'hunk' : inHunk ? 'same' : /^(diff |index |\+\+\+|---)/.test(line) ? 'meta-line' : ''
    items.push({ kind: kind, line: line })
  })
  flush()
  return items
}
function unifiedItem(pre, item) {
  if (!item.del && !item.add) return pre.appendChild(el('div', item.kind === 'same' ? '' : item.kind, item.line || ' '))
  item.del.forEach(function (l, i) { pre.appendChild(lineNode('div', 'del', '-', l, item.add[i])) })
  item.add.forEach(function (l, i) { pre.appendChild(lineNode('div', 'add', '+', l, item.del[i])) })
}
function splitItem(pre, item) {
  var row
  if (item.kind === 'same') {
    row = el('div', 'sb')
    row.appendChild(el('span', '', item.line.slice(1) || ' '))
    row.appendChild(el('span', '', item.line.slice(1) || ' '))
    return pre.appendChild(row)
  }
  if (!item.del) return unifiedItem(pre, item)
  for (var i = 0; i < Math.max(item.del.length, item.add.length); i++) {
    row = el('div', 'sb')
    row.appendChild(i < item.del.length ? lineNode('span', 'del', '', item.del[i], item.add[i]) : el('span', '', ' '))
    row.appendChild(i < item.add.length ? lineNode('span', 'add', '', item.add[i], item.del[i]) : el('span', '', ' '))
    pre.appendChild(row)
  }
}
function paintDiff() {
  var pre = document.getElementById('diff')
  splitShown = document.getElementById('main').clientWidth >= SPLIT_WIDTH
  pre.textContent = ''
  diffItems(lastDiff).forEach(function (item) { (splitShown ? splitItem : unifiedItem)(pre, item) })
}
function showDiff(title, text) {
  document.getElementById('title').textContent = title
  document.getElementById('blank').hidden = true
  document.getElementById('blank').style.display = 'none'
  document.body.classList.add('detail')
  var pre = document.getElementById('diff')
  pre.hidden = false
  lastDiff = text
  paintDiff()
  pre.scrollTop = 0
}
new ResizeObserver(function () {
  var wide = document.getElementById('main').clientWidth >= SPLIT_WIDTH
  if (lastDiff !== null && wide !== splitShown) paintDiff()
}).observe(document.getElementById('main'))
document.getElementById('back').appendChild(svg('back'))
document.getElementById('back').onclick = function () { document.body.classList.remove('detail') }
// Si se elige otro archivo antes de que llegue la respuesta, gana el último elegido.
function openDiff(title, query) {
  var request = ++diffRequest
  var heading = document.getElementById('title')
  heading.textContent = 'Cargando…'
  api(query).then(function (j) {
    if (request === diffRequest) showDiff(title, j.diff || 'Sin diferencias de texto')
  }).catch(function (e) {
    if (request === diffRequest) heading.textContent = ''
    toast(e.message)
  })
}
function openFile(r, f, staged) {

  render()

  data.forEach(function (r) {
    if (term && (r.name + ' ' + (r.branch || '')).toLowerCase().indexOf(term) < 0) return
    if (filter && !FILTERS[filter].test(r)) return
    var last = spaces[spaces.length - 1]
    if (last && last.name === r.group) last.repos.push(r)
    else spaces.push({ name: r.group, repos: [r] })
  })
  list.textContent = ''
  spaces.forEach(function (s) { spaceView(s.name, pendingFirst(s.repos), term) })
  if (!spaces.length && snapshot) list.appendChild(el('div', '', '')).id = 'empty'
  var none = document.getElementById('empty')
  if (none) none.textContent = term || filter ? 'Nada coincide.' : 'Orca no tiene proyectos.'
  list.scrollTop = top
}
find.oninput = render
function load(force) {
  return api('/api/repos' + (force ? '?fresh=1' : '')).then(function (j) {
    offline = 0
    if (lostToast) { lostToast = false; document.getElementById('toast').style.display = 'none' }
    var next = JSON.stringify(j)
    var typing = document.activeElement && document.activeElement !== find && /TEXTAREA|INPUT/.test(document.activeElement.tagName)
    if (next === snapshot && !force) return
    data = j
    snapshot = next
    if (!typing || force) render()
  }).catch(function (e) {
    // El servicio se reinicia al actualizarse: un corte de segundos no merece un aviso.
    if (!(e instanceof TypeError)) return toast(e.message)
    offline++
    if (offline >= OFFLINE_POLLS && !lostToast) {
      lostToast = true
      toast('Se perdió la conexión con el servidor de la app.')
    }
  })
}
load(true)
setInterval(function () { if (!document.hidden) load(false) }, 4000)
// El servidor decide si ya toca: esto solo avisa que hay alguien mirando.
function autoFetch() {
  if (document.hidden) return
  fetch('/api/fetch-all', { method: 'POST', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' } }).then(reply).then(function (j) {
    if (!j.skipped) load(true)
  }).catch(function () {}) // sin red no hay nada que avisar: se reintenta en la próxima vuelta
}
autoFetch()
setInterval(autoFetch, 60000)
// Mantiene vivo el servidor mientras la pestaña exista, aunque esté en segundo plano.
setInterval(function () { fetch('/api/ping', { headers: { 'X-Token': TOKEN } }).catch(function () {}) }, 60000)
})()
</script>
